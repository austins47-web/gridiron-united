[api]
enabled = true

[functions.sync-players]
verify_jwt = false

[functions.sportsdata]
verify_jwt = false

[functions.ai-roster-analysis]
verify_jwt = false

# Calendar apps poll the feed without logging in; its token is the key
[functions.calendar]
verify_jwt = false

# The Shop TV board: a TV can't sign in, so its 8-character code is the key
[functions.shop-tv]
verify_jwt = false

# The song on the league's Spotify, for the Shop TV (its code is the key, like shop-tv)
[functions.tv-now-playing]
verify_jwt = false

# A Spotify token for the Shop TV's speaker (its code is the key, like shop-tv)
[functions.tv-spotify-token]
verify_jwt = false

# Connecting Spotify: Spotify sends the commissioner back here without a
# session; the start (POST) checks their sign-in itself
[functions.spotify-connect]
verify_jwt = false

# Conquest: the hourly cron settles finished weeks without a session; starting a
# war checks the commissioner itself
[functions.conquest]
verify_jwt = false
