<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover makes iOS report the safe-area insets (home indicator,
         notch); without it env(safe-area-inset-*) is always 0 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Installable app (home screen) — needed for push notifications on iPhone -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0A0A0A" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Gridiron" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <title>Gridiron United — CFB + NFL Fantasy</title>
    <meta name="description" content="Fantasy football that combines NFL and college players. Draft CFB and NFL athletes on the same roster." />

    <!-- Open Graph (iMessage, Discord, Slack, Facebook) -->
    <meta property="og:title" content="Gridiron United — CFB + NFL Fantasy" />
    <meta property="og:description" content="Fantasy football that combines NFL and college players. Draft CFB and NFL athletes on the same roster." />
    <meta property="og:image" content="https://gridiron-united.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:url" content="https://gridiron-united.vercel.app" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Gridiron United" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Gridiron United — CFB + NFL Fantasy" />
    <meta name="twitter:description" content="Fantasy football that combines NFL and college players. Draft CFB and NFL athletes on the same roster." />
    <meta name="twitter:image" content="https://gridiron-united.vercel.app/og-image.png" />
    <!-- The fonts are bundled with the app (src/main.tsx): a Google Fonts
         stylesheet here held the app's scripts until Google answered -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
